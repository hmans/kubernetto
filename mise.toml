[tools]
go = "latest"
node = "latest"
pnpm = "latest"
watchexec = "latest"

[tasks.dev]
description = "Run Kubernetto and restart when source files change"
run = "mise watch --restart --stop-signal TERM --map-signal HUP:TERM app"

[tasks.build]
description = "Build Kubernetto"
sources = [
	"**/*.go",
	"**/*.templ",
	"internal/server/ui/assets/**/*",
	"package.json",
	"pnpm-lock.yaml",
	"scripts/**/*",
	"go.mod",
	"go.sum",
	"mise.toml",
	"!**/*_templ.go",
]
outputs = [
	"kubernetto",
	"internal/server/ui/*_templ.go",
]
run = """
pnpm build:assets
go generate ./...
go build -o ./kubernetto ./cmd/kubernetto
"""

[tasks.app]
hide = true
depends = "build"
run = "exec ./kubernetto"
