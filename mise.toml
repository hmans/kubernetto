[tools]
go = "latest"

[tasks.dev]
description = "Run Kubernetto and restart when source files change"
run = "mise watch app --restart --ignore 'internal/server/*_templ.go'"

[tasks.app]
hide = true
run = "go generate ./... && go run ./cmd/kubernetto"
sources = [
  "**/*.go",
  "**/*.templ",
  "internal/server/assets/**",
]
