[tools]
go = "latest"

[tasks.dev]
description = "Run Kubernetto and restart when source files change"
run = "mise watch app --restart --stop-signal TERM --map-signal HUP:TERM --ignore 'internal/server/*_templ.go'"

[tasks.build]
description = "Build Kubernetto"
run = """
go generate ./...
go build -o ./kubernetto ./cmd/kubernetto
"""

[tasks.app]
hide = true
depends = "build"
run = "exec ./kubernetto"
